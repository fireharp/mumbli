name: MumbliApp
options:
  bundleIdPrefix: com.mumbli
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  objectVersion: 54
  generateEmptyDirectories: true

targets:
  MumbliApp:
    type: application
    platform: macOS
    sources:
      - path: MumbliApp
        excludes:
          - "**/*.entitlements"
          - "**/*.plist"
    info:
      path: MumbliApp/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSMicrophoneUsageDescription: "Mumbli needs microphone access to capture your voice for dictation."
        LSMinimumSystemVersion: "13.0"
    entitlements:
      path: MumbliApp/MumbliApp.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mumbli.app
        PRODUCT_NAME: Mumbli
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.7.2" # x-release-please-version
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: MumbliApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: MumbliApp/MumbliApp.entitlements
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    frameworks:
      - AVFoundation.framework
      - ApplicationServices.framework
      - Carbon.framework
    # MARKETING_VERSION above is the one release-please bumps; the checked-in
    # MumbliApp.xcodeproj carries a stale copy of it. The stamp script reads this
    # file and overwrites the built Info.plist, so both paths agree and the About
    # pane also gets the commit it was built from.
    postBuildScripts:
      # The inputFile is what schedules this after Xcode processes Info.plist —
      # without it the stamp gets overwritten by the plist Xcode writes later.
      - script: '"$SRCROOT/scripts/version-stamp.sh"'
        name: Stamp version
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)

  MumbliAppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MumbliAppUITests
    dependencies:
      - target: MumbliApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mumbli.app.uitests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        TEST_TARGET_NAME: MumbliApp
        GENERATE_INFOPLIST_FILE: "YES"
